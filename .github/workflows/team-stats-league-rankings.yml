name: Team Stats League Rankings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "team_analysis_kernel.py"
      - "team_research_stats.py"
      - "api/__init__.py"
      - "api/team_stats_rankings.py"
      - "tests/test_team_stats_rankings_api.py"
      - "web/src/app/team-stats/**"
      - "web/package.json"
      - "web/tsconfig.json"
      - ".github/workflows/team-stats-league-rankings.yml"

permissions:
  contents: read

jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FRL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: python -m pip install pytest fastapi pydantic

      - name: Verify shared-kernel rankings projection
        run: >-
          python -m pytest -q
          tests/test_team_stats_rankings_api.py
          tests/test_team_stats_overview_kernel_api.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck web application
        working-directory: web
        run: npm run typecheck

      - name: Build web application
        working-directory: web
        run: npm run build
