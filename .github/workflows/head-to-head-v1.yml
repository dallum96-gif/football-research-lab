name: Head-to-Head V1

on:
  push:
    branches:
      - model/poisson-v1
    paths:
      - "head_to_head.py"
      - "api/head_to_head.py"
      - "api/__init__.py"
      - "tests/test_head_to_head.py"
      - "web/src/app/head-to-head/**"
      - "web/src/app/matchday/[season]/[fixtureId]/page.tsx"
      - ".github/workflows/head-to-head-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FRL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install pytest fastapi pydantic

      - name: Run Head-to-Head and regression tests
        run: >-
          python -m pytest -q
          tests/test_head_to_head.py
          tests/test_matchday_pack.py
          tests/test_team_state.py
          tests/test_adaptive_dixon_coles.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build frontend
        working-directory: web
        run: npm run build
