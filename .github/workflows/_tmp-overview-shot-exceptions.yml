name: Temporary Overview shot exception diagnostic

on:
  pull_request:
    paths:
      - "scripts/_tmp_diagnose_overview_shot_exceptions.py"
      - ".github/workflows/_tmp-overview-shot-exceptions.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FRL
        uses: actions/checkout@v4
      - name: Checkout preserved upstream archive
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/imadeddine-belkat/Premier-League-Stats.git upstream-source
          cd upstream-source
          git sparse-checkout set pl_stats
      - name: Diagnose exceptions
        run: python scripts/_tmp_diagnose_overview_shot_exceptions.py --pl-root upstream-source/pl_stats
