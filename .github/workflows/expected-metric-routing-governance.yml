name: Expected metric routing governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "expected_metric_routing.py"
      - "tests/test_expected_metric_routing.py"
      - "FRL_EXPECTED_METRIC_ROUTING_CONTRACT.md"
      - ".github/workflows/expected-metric-routing-governance.yml"

permissions:
  contents: read

jobs:
  expected-metric-routing-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FRL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run expected-metric routing regressions
        run: python -m pytest -q tests/test_expected_metric_routing.py
