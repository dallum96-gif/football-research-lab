name: Apply Team Stats kernel patch

on:
  pull_request:
    paths:
      - "scripts/apply_team_stats_overview_kernel_patch.py"
      - ".github/workflows/apply-team-stats-kernel-patch.yml"

permissions:
  contents: write

jobs:
  apply-team-stats-kernel-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/minimum-team-analysis-kernel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact-marker endpoint patch
        run: python scripts/apply_team_stats_overview_kernel_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit endpoint refactor if changed
        shell: bash
        run: |
          if git diff --quiet -- api/frl_api.py; then
            echo "No endpoint source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/frl_api.py
          git commit -m "Refactor Team Stats Overview onto analysis kernel"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
