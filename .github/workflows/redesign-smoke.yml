name: Redesign smoke tests

on:
  push:
    branches:
      - redesign-github-sync
      - design/player-filter-tiles
  pull_request:
    branches:
      - redesign-github-sync
      - design/player-filter-tiles

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -r requirements.txt

      - name: Run redesign smoke tests
        run: python -m pytest -q tests/test_redesign_smoke.py tests/test-data-platform-proof.py tests/test-analytical-materialization.py tests/test-data-platform-query-proof.py tests/test_frl_analytical_query_seam.py
