name: Team Stats governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "team_metric_missingness.py"
      - "team_research_stats.py"
      - "tests/test_team_research_stats.py"
      - ".github/workflows/team-stats-governance.yml"

permissions:
  contents: read

jobs:
  team-stats-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FRL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run Team Stats governance regressions
        run: python -m pytest -q tests/test_team_research_stats.py
